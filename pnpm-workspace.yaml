packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: false
  dtrace-provider: false
  esbuild: true
  re2: true

# Exact Phase 1 versions reviewed before the registry minimum-release-age window elapsed.
# Keep this list version-specific; Renovate must remove/update entries through a reviewed PR.
minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.5'
  - renovate@44.39.3
  # Security patch reviewed on 2026-10-01; keep these exemptions version-specific.
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
