name: Host Release Diagnostics Verification

on:
  push:
    branches: [fix/host-release-diagnostics]

permissions:
  contents: read

concurrency:
  group: host-release-diagnostics-verification
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SITE_BASE_URL: https://www.tungchiahui.cn

jobs:
  quality-static:
    name: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm run check:biome

      - name: TypeScript source and boundary policy
        run: pnpm run check:source

      - name: GitHub workflow trigger and credential policy
        run: pnpm run check:workflows

      - name: Drizzle migration consistency
        run: pnpm run check:drizzle

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate Renovate policy
        run: pnpm run renovate:validate

      - name: Production build
        run: pnpm run build

  quality-unit:
    name: quality-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit

  quality-infrastructure:
    name: quality-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production foundation, recovery and blue-green tests
        run: pnpm run test:infra && pnpm run test:recovery

  quality-integration:
    name: quality-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Disposable infrastructure integration and critical E2E tests
        run: pnpm run test:integration

  quality-migration:
    name: quality-migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL migration suite
        run: pnpm run test:migration

  quality-gate:
    name: quality-gate
    needs:
      - quality-static
      - quality-unit
      - quality-infrastructure
      - quality-integration
      - quality-migration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every parallel quality gate
        env:
          STATIC_RESULT: ${{ needs.quality-static.result }}
          UNIT_RESULT: ${{ needs.quality-unit.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.quality-infrastructure.result }}
          INTEGRATION_RESULT: ${{ needs.quality-integration.result }}
          MIGRATION_RESULT: ${{ needs.quality-migration.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STATIC_RESULT" == "success" ]]
          [[ "$UNIT_RESULT" == "success" ]]
          [[ "$INFRASTRUCTURE_RESULT" == "success" ]]
          [[ "$INTEGRATION_RESULT" == "success" ]]
          [[ "$MIGRATION_RESULT" == "success" ]]

