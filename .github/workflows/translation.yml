name: Validate Translation Memory

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact content repository commit to validate without paid calls
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed validation client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate exact content SHA
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: '[[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out translation memory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tungchiahui/tungchiahui_content
          ref: ${{ inputs.source_commit }}
          path: canonical-content
      - name: Verify checked-out content identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: 'test "$(git -C canonical-content rev-parse HEAD)" = "$SOURCE_COMMIT"'
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate memory without calling a provider
        run: ./site translate validate --content-root canonical-content
