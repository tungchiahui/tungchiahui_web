name: Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch Git SHA to quality-check, build and deploy
        required: true
        type: string
      reason:
        description: Audited retry or specified-SHA deployment reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: application-production-release
  cancel-in-progress: false

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SITE_BASE_URL: https://www.tungchiahui.cn

jobs:
  resolve-release:
    name: resolve-main-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      git_sha: ${{ steps.release.outputs.git_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve a main release SHA
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$PUSH_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_sha="$REQUESTED_SHA"
          fi
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --prune origin main
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "git_sha=$release_sha" >>"$GITHUB_OUTPUT"

  quality-gate:
    name: quality-gate
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Format and lint
        run: pnpm run check:biome

      - name: TypeScript source and boundary policy
        run: pnpm run check:source

      - name: GitHub workflow trigger and credential policy
        run: pnpm run check:workflows

      - name: Drizzle migration consistency
        run: pnpm run check:drizzle

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Production foundation, recovery and blue-green tests
        run: pnpm run test:infra && pnpm run test:recovery

      - name: Disposable infrastructure integration and critical E2E tests
        run: pnpm run test:integration

      - name: PostgreSQL migration suite
        run: pnpm run test:migration

      - name: Validate Renovate policy
        run: pnpm run renovate:validate

      - name: Production build
        run: pnpm run build

  build:
    name: build-and-publish-immutable-image-set
    needs: [resolve-release, quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      git_sha: ${{ needs.resolve-release.outputs.git_sha }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web
      POSTGRES_IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web-postgres
      RECOVERY_IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web-recovery
      SERVICE_IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web-service
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the Git-SHA image set
        id: publish
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          publish_image() {
            repository="$1"
            dockerfile="$2"
            image_tag="$repository:$RELEASE_SHA"
            docker build \
              --build-arg "SITE_DEPLOYMENT_SHA=$RELEASE_SHA" \
              --file "$dockerfile" \
              --tag "$image_tag" \
              .
            docker push "$image_tag"
          }
          publish_image "$POSTGRES_IMAGE_REPOSITORY" ops/production/images/postgres.Dockerfile
          publish_image "$RECOVERY_IMAGE_REPOSITORY" ops/production/images/recovery.Dockerfile
          publish_image "$SERVICE_IMAGE_REPOSITORY" ops/production/images/services.Dockerfile
          publish_image "$IMAGE_REPOSITORY" ops/production/images/web.Dockerfile

          image_tag="$IMAGE_REPOSITORY:$RELEASE_SHA"
          image_digest="$(docker buildx imagetools inspect "$image_tag" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image_digest=$image_digest" >>"$GITHUB_OUTPUT"

  deploy:
    name: shared-control-plane-blue-green-deployment
    needs: build
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_DIGEST: ${{ needs.build.outputs.image_digest }}
      RELEASE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || format('main release workflow {0}', github.run_id) }}
      RELEASE_SHA: ${{ needs.build.outputs.git_sha }}
      SITE_CONTROL_API_URL: https://www.tungchiahui.cn
    steps:
      - name: Check out the reviewed workflow control client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked deployment client
        run: pnpm install --frozen-lockfile

      - name: Trigger and wait for the shared deployment engine
        run: >-
          ./site deploy "$RELEASE_SHA" --image-digest "$RELEASE_DIGEST"
          --reason "$RELEASE_REASON" --wait
