name: Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch Git SHA to quality-check, build and deploy
        required: true
        type: string
      reason:
        description: Audited retry or specified-SHA deployment reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: application-production-release
  cancel-in-progress: false

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SITE_BASE_URL: https://www.tungchiahui.cn

jobs:
  resolve-release:
    name: resolve-main-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      git_sha: ${{ steps.release.outputs.git_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve a main release SHA
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$PUSH_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_sha="$REQUESTED_SHA"
          fi
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --prune origin main
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "git_sha=$release_sha" >>"$GITHUB_OUTPUT"

  quality-static:
    name: quality-static
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm run check:biome

      - name: TypeScript source and boundary policy
        run: pnpm run check:source

      - name: GitHub workflow trigger and credential policy
        run: pnpm run check:workflows

      - name: Drizzle migration consistency
        run: pnpm run check:drizzle

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate Renovate policy
        run: pnpm run renovate:validate

      - name: Production build
        run: pnpm run build

  quality-unit:
    name: quality-unit
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit

  quality-infrastructure:
    name: quality-infrastructure
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production foundation, recovery and blue-green tests
        run: pnpm run test:infra && pnpm run test:recovery

  quality-integration:
    name: quality-integration
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Disposable infrastructure integration and critical E2E tests
        run: pnpm run test:integration

  quality-migration:
    name: quality-migration
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL migration suite
        run: pnpm run test:migration

  quality-gate:
    name: quality-gate
    needs:
      - quality-static
      - quality-unit
      - quality-infrastructure
      - quality-integration
      - quality-migration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every parallel quality gate
        env:
          STATIC_RESULT: ${{ needs.quality-static.result }}
          UNIT_RESULT: ${{ needs.quality-unit.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.quality-infrastructure.result }}
          INTEGRATION_RESULT: ${{ needs.quality-integration.result }}
          MIGRATION_RESULT: ${{ needs.quality-migration.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STATIC_RESULT" == "success" ]]
          [[ "$UNIT_RESULT" == "success" ]]
          [[ "$INFRASTRUCTURE_RESULT" == "success" ]]
          [[ "$INTEGRATION_RESULT" == "success" ]]
          [[ "$MIGRATION_RESULT" == "success" ]]

  build-postgres:
    name: build-postgres
    needs: [resolve-release, quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    env:
      POSTGRES_IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web-postgres
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish PostgreSQL image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/production/images/postgres.Dockerfile
          push: true
          tags: ${{ env.POSTGRES_IMAGE_REPOSITORY }}:${{ needs.resolve-release.outputs.git_sha }}
          build-args: SITE_DEPLOYMENT_SHA=${{ needs.resolve-release.outputs.git_sha }}
          cache-from: type=gha,scope=production-postgres
          cache-to: type=gha,mode=max,scope=production-postgres

  build-recovery:
    name: build-recovery
    needs: [resolve-release, quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    env:
      RECOVERY_IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web-recovery
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish recovery image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/production/images/recovery.Dockerfile
          push: true
          tags: ${{ env.RECOVERY_IMAGE_REPOSITORY }}:${{ needs.resolve-release.outputs.git_sha }}
          build-args: SITE_DEPLOYMENT_SHA=${{ needs.resolve-release.outputs.git_sha }}
          cache-from: type=gha,scope=production-recovery
          cache-to: type=gha,mode=max,scope=production-recovery

  build-service:
    name: build-service
    needs: [resolve-release, quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    env:
      SERVICE_IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web-service
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish service image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/production/images/services.Dockerfile
          push: true
          tags: ${{ env.SERVICE_IMAGE_REPOSITORY }}:${{ needs.resolve-release.outputs.git_sha }}
          build-args: SITE_DEPLOYMENT_SHA=${{ needs.resolve-release.outputs.git_sha }}
          cache-from: type=gha,scope=production-service
          cache-to: type=gha,mode=max,scope=production-service

  build-web:
    name: build-web
    needs: [resolve-release, build-service]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/tungchiahui/tungchiahui_web
    steps:
      - name: Check out approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.git_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish web release manifest image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/production/images/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.resolve-release.outputs.git_sha }}
          build-args: |
            SITE_DEPLOYMENT_SHA=${{ needs.resolve-release.outputs.git_sha }}
            SITE_SERVICE_IMAGE_DIGEST=${{ needs.build-service.outputs.image_digest }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web

  build:
    name: build-and-publish-immutable-image-set
    needs: [resolve-release, build-postgres, build-recovery, build-service, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      git_sha: ${{ needs.resolve-release.outputs.git_sha }}
      image_digest: ${{ needs.build-web.outputs.image_digest }}
      postgres_image_digest: ${{ needs.build-postgres.outputs.image_digest }}
      recovery_image_digest: ${{ needs.build-recovery.outputs.image_digest }}
      service_image_digest: ${{ needs.build-service.outputs.image_digest }}
    steps:
      - name: Validate the immutable release manifest
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.git_sha }}
          WEB_DIGEST: ${{ needs.build-web.outputs.image_digest }}
          POSTGRES_DIGEST: ${{ needs.build-postgres.outputs.image_digest }}
          RECOVERY_DIGEST: ${{ needs.build-recovery.outputs.image_digest }}
          SERVICE_DIGEST: ${{ needs.build-service.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          for digest in "$WEB_DIGEST" "$POSTGRES_DIGEST" "$RECOVERY_DIGEST" "$SERVICE_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          {
            echo '### Immutable release manifest'
            echo '```json'
            jq -n \
              --arg gitSha "$RELEASE_SHA" \
              --arg web "$WEB_DIGEST" \
              --arg service "$SERVICE_DIGEST" \
              --arg recovery "$RECOVERY_DIGEST" \
              --arg postgres "$POSTGRES_DIGEST" \
              '{gitSha: $gitSha, images: {web: $web, service: $service, recovery: $recovery, postgres: $postgres}}'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: shared-control-plane-blue-green-deployment
    needs: build
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_DIGEST: ${{ needs.build.outputs.image_digest }}
      RELEASE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || format('main release workflow {0}', github.run_id) }}
      RELEASE_SHA: ${{ needs.build.outputs.git_sha }}
      SITE_CONTROL_API_URL: https://www.tungchiahui.cn
    steps:
      - name: Check out the reviewed workflow control client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Refuse a stale automatic release
        if: github.event_name == 'push'
        env:
          RELEASE_SHA: ${{ needs.build.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          [[ "$RELEASE_SHA" == "$(git rev-parse origin/main)" ]]

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked deployment client
        run: pnpm install --frozen-lockfile

      - name: Trigger and wait for the shared deployment engine
        run: >-
          ./site deploy "$RELEASE_SHA" --image-digest "$RELEASE_DIGEST"
          --reason "$RELEASE_REASON" --wait

  release-result:
    name: verify-production-release-completed
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both image publication and deployment
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RESULT" == "success" ]]
          [[ "$DEPLOYMENT_ENABLED" == "true" ]]
          [[ "$DEPLOY_RESULT" == "success" ]]
