services:
  postgres:
    image: groonga/pgroonga:4.0.8-alpine-18@sha256:b5c92fa3d86ad76ce75ddd8095f60542cf025348a58b8a38cd0b4a580fe4ce68
    environment:
      POSTGRES_DB: tungchiahui
      POSTGRES_PASSWORD: local-only-postgres
      POSTGRES_USER: tungchiahui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tungchiahui -d tungchiahui"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    volumes:
      - postgres-data:/var/lib/postgresql

  pgbouncer:
    image: percona/percona-pgbouncer:1.25.2-5@sha256:ee8f9b3e8b80b379b47ae41419a0d16de7a20c2be0cae5dbf55fe403d3d9f33d
    entrypoint: ["/usr/bin/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6432'"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro,Z
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro,Z

  s3mock:
    image: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${SITE_S3_BUCKET:?SITE_S3_BUCKET is required}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: ${SITE_S3_RETAIN_FILES:-true}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mock-data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/favicon.ico"]
      interval: 2s
      timeout: 3s
      retries: 45
    networks: [local]
    volumes:
      - s3-data:/s3mock-data

  control-api:
    image: tungchiahui-web-local:phase6
    build:
      context: ../..
      dockerfile: ops/dev/Dockerfile
    command: ["pnpm", "exec", "tsx", "services/control-api/main.ts"]
    environment:
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 8080
      CONTROL_RATE_LIMIT_PER_MINUTE: 120
      CONTROL_REPLAY_WINDOW_SECONDS: 300
      CONTROL_STATE_PATH: /control-state/control.db
      DATABASE_URL: postgresql://tungchiahui:local-only-postgres@pgbouncer:6432/tungchiahui
      SITE_RUNTIME_MODE: ${SITE_RUNTIME_MODE:?SITE_RUNTIME_MODE is required}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: ${SITE_CONTROL_STATE_DIRECTORY:?SITE_CONTROL_STATE_DIRECTORY is required}
        target: /control-state

  fake-deploy-agent:
    image: tungchiahui-web-local:phase6
    pull_policy: never
    command: ["pnpm", "exec", "tsx", "services/fake-deploy-agent/main.ts"]
    environment:
      FAKE_DEPLOY_AGENT_HOST: 0.0.0.0
      FAKE_DEPLOY_AGENT_PORT: 8081
      SITE_RUNTIME_MODE: ${SITE_RUNTIME_MODE:?SITE_RUNTIME_MODE is required}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777

  content-worker:
    image: tungchiahui-web-local:phase6
    pull_policy: never
    command: ["pnpm", "exec", "tsx", "services/content-worker/main.ts"]
    environment:
      CONTENT_WORKER_HOST: 0.0.0.0
      CONTENT_WORKER_POLLING_ENABLED: "false"
      CONTENT_WORKER_PORT: 8083
      DATABASE_URL: postgresql://tungchiahui:local-only-postgres@pgbouncer:6432/tungchiahui
      SITE_RUNTIME_MODE: ${SITE_RUNTIME_MODE:?SITE_RUNTIME_MODE is required}
      SITE_REVALIDATION_ENDPOINT: http://web:3000/api/internal/revalidate
      SITE_REVALIDATION_SECRET: local-only-phase6-revalidation-secret
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8083/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777

  web:
    image: tungchiahui-web-local:phase6
    pull_policy: never
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
    depends_on:
      control-api:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tungchiahui:local-only-postgres@pgbouncer:6432/tungchiahui
      NEXT_TELEMETRY_DISABLED: 1
      S3_ACCESS_KEY_ID: local-only-access-key
      S3_BUCKET: ${SITE_S3_BUCKET:?SITE_S3_BUCKET is required}
      S3_ENDPOINT: http://s3mock:9090
      S3_SECRET_ACCESS_KEY: local-only-secret-key
      SITE_BASE_URL: http://localhost:${SITE_WEB_PORT:-3000}
      SITE_DEPLOYMENT_SHA: "0000000000000000000000000000000000000000"
      SITE_REVALIDATION_SECRET: local-only-phase6-revalidation-secret
      SITE_RUNTIME_MODE: ${SITE_RUNTIME_MODE:?SITE_RUNTIME_MODE is required}
      TRANSLATION_PROVIDER: fake
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 45
    networks: [local]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - next-cache:/workspace/.next

  openresty:
    image: openresty/openresty:1.31.1.1-2-bookworm-fat@sha256:45fbb5026af2127655b247c90735aa65dab60518e7ccfc6ebbac71a7403be430
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/openresty-health"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    read_only: true
    user: nobody
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./openresty.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro,Z

networks:
  local:

volumes:
  next-cache:
  postgres-data:
  s3-data:
