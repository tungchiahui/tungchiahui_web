[databases]
tungchiahui = host=postgres port=5432 dbname=tungchiahui user=tungchiahui password=local-only-postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
ignore_startup_parameters = extra_float_digits
pidfile = /tmp/pgbouncer.pid
logfile = /dev/stdout
