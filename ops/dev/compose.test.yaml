services:
  postgres:
    ports:
      - "127.0.0.1::5432"
  pgbouncer:
    ports:
      - "127.0.0.1::6432"
  s3mock:
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "false"
    ports:
      - "127.0.0.1::9090"
  control-api:
    environment:
      HEALTH_REFERENCE_PROFILE_JSON: '{"height":178,"birthDate":"2000-02-04","sex":"male","reportReference":{"measuredOn":"2026-11-17","age":26,"height":178,"sex":"male","weight":87,"muscleMass":[49.4,62.4],"proteinPercentage":[10.3,17.7],"basalMetabolism":[1317.5,1782.5],"visceralFat":[4.5,9.5,14.5]}}'
    user: "${SITE_HOST_UID:?SITE_HOST_UID is required}:${SITE_HOST_GID:?SITE_HOST_GID is required}"
    ports:
      - "127.0.0.1::8080"
  fake-deploy-agent:
    ports:
      - "127.0.0.1::8081"
  openresty:
    ports:
      - "127.0.0.1::8082"
  web:
    environment:
      NODE_OPTIONS: "--import=/workspace/tools/dev/external-fixtures.ts"
    ports:
      - "127.0.0.1::3000"
