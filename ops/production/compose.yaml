name: tungchiahui-production

x-hardened-service: &hardened-service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-node-tmpfs: &node-tmpfs
  - /tmp:size=32m,mode=1777,noexec,nosuid,nodev

services:
  postgres:
    image: ${TUNGCHIAHUI_POSTGRES_IMAGE:?immutable PostgreSQL image is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "70:70"
    group_add: ["10050"]
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/postgres.env
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=tungchiahui archive-push %p
      - -c
      - archive_timeout=60
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [database]
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    volumes:
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/postgres
        target: /var/lib/postgresql
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/backup-repository
        target: /var/lib/pgbackrest
      - ${TUNGCHIAHUI_CONFIG_ROOT:?config root is required}/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - postgres-socket:/run/postgresql

  pgbouncer:
    <<: *hardened-service
    image: percona/percona-pgbouncer:1.25.2-5@sha256:ee8f9b3e8b80b379b47ae41419a0d16de7a20c2be0cae5dbf55fe403d3d9f33d
    user: "1001:10050"
    entrypoint: [/usr/bin/pgbouncer]
    command: [/etc/pgbouncer/pgbouncer.ini]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "timeout 2 bash -c '</dev/tcp/127.0.0.1/6432'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [application, database]
    tmpfs: *node-tmpfs
    volumes:
      - ${TUNGCHIAHUI_CONFIG_ROOT:?config root is required}/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro

  database-role-bootstrap:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_SERVICE_IMAGE:?immutable service image is required}
    restart: "no"
    profiles: [provision]
    user: "10006:10050"
    command: [node, dist/database-role-bootstrap.cjs]
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/database-role-bootstrap.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    tmpfs: *node-tmpfs

  database-migrate:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_SERVICE_IMAGE:?immutable service image is required}
    restart: "no"
    profiles: [deployment]
    user: "10006:10050"
    command: [node, dist/database-migrate.cjs]
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/database-migrate.env
    environment:
      DEPLOYMENT_HAS_FRESH_RECOVERABLE_BACKUP: "false"
      SITE_RUNTIME_MODE: production
    networks: [database]
    tmpfs: *node-tmpfs

  control-api:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_SERVICE_IMAGE:?immutable service image is required}
    user: "10002:10050"
    command: [node, dist/control-api.cjs]
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/control-api.env
    environment:
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: "8080"
      CONTROL_RATE_LIMIT_PER_MINUTE: ${TUNGCHIAHUI_CONTROL_RATE_LIMIT_PER_MINUTE:-120}
      CONTROL_REPLAY_WINDOW_SECONDS: "300"
      CONTROL_STATE_PATH: /control-state/control.db
      SITE_RUNTIME_MODE: production
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [edge, application]
    tmpfs: *node-tmpfs
    volumes:
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/control-state
        target: /control-state

  content-worker:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_SERVICE_IMAGE:?immutable service image is required}
    user: "10003:10050"
    command: [node, dist/content-worker.cjs]
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/content-worker.env
    environment:
      CONTENT_WORKER_HOST: 0.0.0.0
      CONTENT_WORKER_POLLING_ENABLED: ${TUNGCHIAHUI_CONTENT_POLLING_ENABLED:-false}
      CONTENT_WORKER_PORT: "8083"
      SEARCH_WORKER_POLLING_ENABLED: ${TUNGCHIAHUI_SEARCH_POLLING_ENABLED:-false}
      SITE_REVALIDATION_ENDPOINT: http://web-blue:3000/api/internal/revalidate
      SITE_RUNTIME_MODE: production
      TRANSLATION_PROVIDER: disabled
      TRANSLATION_WORKER_POLLING_ENABLED: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8083/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [application]
    tmpfs: *node-tmpfs

  web-blue:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_WEB_BLUE_IMAGE:?immutable blue web image is required}
    user: "10001:10001"
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/web.env
    environment:
      SITE_DEPLOYMENT_SHA: ${TUNGCHIAHUI_BLUE_DEPLOYMENT_SHA:?blue Git SHA is required}
      SITE_RUNTIME_MODE: production
      SITE_SLOT: blue
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 45
    networks: [edge, application, deployment-probe]
    tmpfs: *node-tmpfs

  web-green:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_WEB_GREEN_IMAGE:?immutable green web image is required}
    user: "10001:10001"
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/web.env
    environment:
      SITE_DEPLOYMENT_SHA: ${TUNGCHIAHUI_GREEN_DEPLOYMENT_SHA:?green Git SHA is required}
      SITE_RUNTIME_MODE: production
      SITE_SLOT: green
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 45
    networks: [edge, application, deployment-probe]
    tmpfs: *node-tmpfs

  deploy-agent:
    <<: *hardened-service
    image: ${TUNGCHIAHUI_RECOVERY_IMAGE:?immutable recovery image is required}
    user: "70:10050"
    group_add:
      - ${TUNGCHIAHUI_DOCKER_SOCKET_GID:?Docker socket GID is required}
    command: [node, dist/deploy-agent.cjs]
    depends_on:
      control-api:
        condition: service_healthy
    env_file:
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/backup.env
    environment:
      BACKUP_AGE_IDENTITY_PATH: /run/secrets/backup-age-identity.txt
      BACKUP_LOCAL_REPOSITORY_PATH: /var/lib/pgbackrest
      BACKUP_PGBACKREST_CONFIG_PATH: /etc/pgbackrest/pgbackrest.conf
      BACKUP_PGBACKREST_STANZA: tungchiahui
      BACKUP_POSTGRES_DATA_PATH: /var/lib/postgresql/18/docker
      BACKUP_WORK_DIRECTORY: /var/lib/tungchiahui-backup-work
      CONTROL_STATE_PATH: /control-state/control.db
      DEPLOYMENT_ACTIVE_SLOT_CONFIG_PATH: /deployment-config/active-slot.conf
      DEPLOYMENT_ARTICLE_PATH: /blog/phase-3-seed
      DEPLOYMENT_ASSET_PATH: /docs/ros2/core/index.html
      DEPLOYMENT_BACKUP_MAX_AGE_SECONDS: ${TUNGCHIAHUI_DEPLOYMENT_BACKUP_MAX_AGE_SECONDS:?backup freshness policy is required}
      DEPLOYMENT_BLUE_CONTAINER_NAME: ${TUNGCHIAHUI_BLUE_CONTAINER_NAME:?blue container name is required}
      DEPLOYMENT_BLUE_URL: http://web-blue:3000
      DEPLOYMENT_GREEN_CONTAINER_NAME: ${TUNGCHIAHUI_GREEN_CONTAINER_NAME:?green container name is required}
      DEPLOYMENT_GREEN_URL: http://web-green:3000
      DEPLOYMENT_JOURNAL_PATH: /app/deployment/drizzle/meta/_journal.json
      DEPLOYMENT_MIGRATION_CONTAINER_NAME: ${TUNGCHIAHUI_MIGRATION_CONTAINER_NAME:?migration container name is required}
      DEPLOYMENT_MIGRATION_POLICY_PATH: /app/deployment/drizzle/migration-policy.json
      DEPLOYMENT_OPENRESTY_CONTAINER_NAME: ${TUNGCHIAHUI_OPENRESTY_CONTAINER_NAME:?OpenResty container name is required}
      DEPLOYMENT_POLLING_ENABLED: "true"
      DEPLOYMENT_PUBLIC_ENTRY_URL: https://openresty:8443
      DEPLOYMENT_SEARCH_QUERY: ROS2_Control
      DEPLOYMENT_STABILIZATION_SECONDS: ${TUNGCHIAHUI_DEPLOYMENT_STABILIZATION_SECONDS:?stabilization policy is required}
      DEPLOY_AGENT_HOST: 0.0.0.0
      DEPLOY_AGENT_PORT: "8081"
      DOCKER_SOCKET_PATH: /run/deploy-capability/docker.sock
      POSTGRES_CONTAINER_NAME: ${TUNGCHIAHUI_POSTGRES_CONTAINER_NAME:?PostgreSQL container name is required}
      RECOVERY_POLLING_ENABLED: "true"
      SITE_RUNTIME_MODE: production
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backup-egress, deploy-control, deployment-probe]
    tmpfs: *node-tmpfs
    volumes:
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/control-state
        target: /control-state
      - type: bind
        source: ${TUNGCHIAHUI_CONFIG_ROOT:?config root is required}/deployment
        target: /deployment-config
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/postgres
        target: /var/lib/postgresql
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/backup-repository
        target: /var/lib/pgbackrest
      - type: bind
        source: ${TUNGCHIAHUI_DATA_ROOT:?data root is required}/backup-work
        target: /var/lib/tungchiahui-backup-work
      - ${TUNGCHIAHUI_CONFIG_ROOT:?config root is required}/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/backup-age-identity.txt:/run/secrets/backup-age-identity.txt:ro
      - postgres-socket:/run/postgresql
      - /var/run/docker.sock:/run/deploy-capability/docker.sock:ro

  openresty:
    <<: *hardened-service
    image: openresty/openresty:1.31.1.1-2-bookworm-fat@sha256:45fbb5026af2127655b247c90735aa65dab60518e7ccfc6ebbac71a7403be430
    user: "10005:10050"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --insecure, --fail, --silent, https://127.0.0.1:8443/openresty-health]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [edge, deployment-probe]
    ports:
      - "${TUNGCHIAHUI_ORIGIN_PORT:-8443}:8443"
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
      - /var/run:size=8m,mode=755,nosuid,nodev
    volumes:
      - ${TUNGCHIAHUI_CONFIG_ROOT:?config root is required}/openresty.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ${TUNGCHIAHUI_CONFIG_ROOT:?config root is required}/deployment:/etc/tungchiahui/deployment:ro
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/origin.crt:/run/secrets/origin.crt:ro
      - ${TUNGCHIAHUI_SECRET_DIRECTORY:?secret directory is required}/origin.key:/run/secrets/origin.key:ro

networks:
  application:
    internal: true
  database:
    internal: true
  deploy-control:
    internal: true
  deployment-probe:
    internal: true
  backup-egress:
  edge:
    enable_ipv6: true

volumes:
  postgres-socket:
