worker_processes auto;
pid /tmp/openresty.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  log_format structured escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"level":"info",'
    '"component":"openresty",'
    '"event":"http_request_completed",'
    '"request_id":"$request_id",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"route":"$uri",'
    '"status":$status,'
    '"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_duration_seconds":"$upstream_response_time",'
    '"request_bytes":$request_length,'
    '"response_bytes":$bytes_sent'
  '}';
  access_log /dev/stdout structured;
  limit_req_zone $binary_remote_addr zone=public_origin:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=control_origin:10m rate=20r/s;
  limit_req_status 429;
  client_body_temp_path /tmp/client-body;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  scgi_temp_path /tmp/scgi;
  uwsgi_temp_path /tmp/uwsgi;
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen [::]:8443 ssl ipv6only=off;
    server_name www.tungchiahui.cn ddns.tungchiahui.cn;

    ssl_certificate /run/secrets/origin.crt;
    ssl_certificate_key /run/secrets/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; media-src 'self' https:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /openresty-health {
      access_log off;
      default_type application/json;
      return 200 '{"service":"openresty","status":"ok"}';
    }

    location ^~ /api/internal/ {
      return 404;
    }

    location ^~ /api/ops/ {
      if ($request_method !~ ^(GET|POST|PUT)$) { return 405; }
      limit_req zone=control_origin burst=40 nodelay;
      set $control_upstream control-api:8080;
      proxy_pass http://$control_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_cache_bypass 1;
      proxy_no_cache 1;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "DENY" always;
    }

    location / {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      limit_req zone=public_origin burst=100 nodelay;
      include /etc/tungchiahui/deployment/active-slot.conf;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
