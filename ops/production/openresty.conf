worker_processes auto;
pid /tmp/openresty.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client-body;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  scgi_temp_path /tmp/scgi;
  uwsgi_temp_path /tmp/uwsgi;
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen [::]:8443 ssl ipv6only=off;
    server_name www.tungchiahui.cn ddns.tungchiahui.cn;

    ssl_certificate /run/secrets/origin.crt;
    ssl_certificate_key /run/secrets/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /openresty-health {
      access_log off;
      default_type application/json;
      return 200 '{"service":"openresty","status":"ok"}';
    }

    location ^~ /api/ops/ {
      set $control_upstream control-api:8080;
      proxy_pass http://$control_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass 1;
      proxy_no_cache 1;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      include /etc/tungchiahui/deployment/active-slot.conf;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
