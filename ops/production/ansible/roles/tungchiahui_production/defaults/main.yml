---
tungchiahui_compose_project_name: tungchiahui-production
tungchiahui_config_root: /etc/tungchiahui
tungchiahui_content_polling_enabled: "false"
tungchiahui_control_rate_limit_per_minute: "120"
tungchiahui_data_root: /var/lib/tungchiahui
tungchiahui_deployment_sha: ""
tungchiahui_deployment_backup_max_age_seconds: ""
tungchiahui_deployment_stabilization_seconds: ""
tungchiahui_install_packages: true
tungchiahui_manage_stack: true
tungchiahui_origin_port: "8443"
tungchiahui_postgres_image: ""
tungchiahui_recovery_image: ""
tungchiahui_repository_root: "{{ playbook_dir }}/../../../.."
tungchiahui_runtime_group_gid: 10050
tungchiahui_secret_file: ""
tungchiahui_secret_root: /run/tungchiahui/secrets
tungchiahui_search_polling_enabled: "false"
tungchiahui_service_image: ""
tungchiahui_web_image: ""
