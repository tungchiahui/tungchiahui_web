tungchiahui_install_packages: true
tungchiahui_manage_stack: true
tungchiahui_reconcile_control_api: false
tungchiahui_postgres_image: ""
tungchiahui_recovery_image: ""
tungchiahui_repository_root: "{{ playbook_dir }}/../../../.."
tungchiahui_runtime_group_gid: 10050
tungchiahui_production_env_file: "{{ tungchiahui_config_root }}/.env"
tungchiahui_secret_root: /etc/tungchiahui/secrets
