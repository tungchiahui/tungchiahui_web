---
- name: Validate stable host and immutable release inputs
  ansible.builtin.assert:
    that:
      - ansible_host is match('^[A-Za-z][A-Za-z0-9._-]*$')
      - ansible_host is not match('^[0-9.]+$')
      - tungchiahui_deployment_article_path is match('^/.+')
      - tungchiahui_deployment_asset_path is match('^/.+')
      - tungchiahui_deployment_sha is match('^[a-f0-9]{40}$')
      - tungchiahui_deployment_sha != '0000000000000000000000000000000000000000'
      - tungchiahui_deployment_backup_max_age_seconds | int > 0
      - tungchiahui_deployment_image_repository is match('^[a-z0-9.-]+(?::[0-9]{2,5})?/[a-z0-9._/-]+$')
      - tungchiahui_deployment_search_query | trim | length > 0
      - tungchiahui_control_rate_limit_per_minute | int > 0
      - tungchiahui_control_rate_limit_per_minute | int <= 10000
      - tungchiahui_reconcile_control_api is boolean
      - tungchiahui_origin_bind_address in ['127.0.0.1', '::1']
      - tungchiahui_observability_backup_max_age_seconds | int > 0
      - tungchiahui_observability_disk_critical_percent | int >= 50
      - tungchiahui_observability_disk_critical_percent | int <= 99
      - tungchiahui_observability_interval_seconds | int >= 10
      - tungchiahui_observability_job_max_age_seconds | int > 0
      - tungchiahui_observability_latency_warning_ms | int > 0
      - tungchiahui_observability_origin_hostname is match('^[A-Za-z0-9.-]+$')
      - tungchiahui_observability_origin_url is match('^(https://|http://openresty:8082/)')
      - tungchiahui_observability_public_url is match('^(https://|http://openresty:8082/)')
      - tungchiahui_observability_restore_drill_max_age_seconds | int > 0
      - tungchiahui_observability_restore_drill_timestamp is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T')
      - tungchiahui_web_image is match('^.+:[a-f0-9]{40}$')
      - tungchiahui_service_image is match('^.+:[a-f0-9]{40}$')
      - tungchiahui_recovery_image is match('^.+:[a-f0-9]{40}$')
      - tungchiahui_postgres_image is match('^.+:[a-f0-9]{40}$')
      - "':latest' not in tungchiahui_web_image"
      - "':latest' not in tungchiahui_service_image"
      - "':latest' not in tungchiahui_recovery_image"
      - "':latest' not in tungchiahui_postgres_image"
      - tungchiahui_production_env_file | length > 0
    fail_msg: Production provisioning requires a hostname/SSH alias, exact Git SHA images and a host-local production env file.

- name: Install pinned host prerequisites
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  when: tungchiahui_install_packages | bool

- name: Ensure Docker is enabled
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: tungchiahui_install_packages | bool

- name: Create runtime group
  ansible.builtin.group:
    name: tungchiahui-runtime
    gid: "{{ tungchiahui_runtime_group_gid }}"
    system: true
    state: present

- name: Create durable and configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ tungchiahui_config_root }}", owner: root, group: tungchiahui-runtime, mode: "0750" }
    - { path: "{{ tungchiahui_config_root }}/backup-hooks.d", owner: root, group: tungchiahui-runtime, mode: "0750" }
    - { path: "{{ tungchiahui_config_root }}/deployment", owner: "70", group: tungchiahui-runtime, mode: "2770" }
    - { path: "{{ tungchiahui_data_root }}", owner: root, group: tungchiahui-runtime, mode: "0750" }
    - { path: "{{ tungchiahui_data_root }}/control-state", owner: "10002", group: tungchiahui-runtime, mode: "2770" }
    - { path: "{{ tungchiahui_data_root }}/backup-repository", owner: "70", group: tungchiahui-runtime, mode: "0750" }
    - { path: "{{ tungchiahui_data_root }}/backup-work", owner: "70", group: tungchiahui-runtime, mode: "0750" }
    - { path: "{{ tungchiahui_data_root }}/postgres", owner: "70", group: "70", mode: "0700" }
    - { path: "{{ tungchiahui_secret_root }}", owner: root, group: tungchiahui-runtime, mode: "0750" }

- name: Inspect host-local production env file
  ansible.builtin.stat:
    path: "{{ tungchiahui_production_env_file }}"
    checksum_algorithm: sha256
  register: tungchiahui_production_env
  no_log: true

- name: Require deployment-root production env file permissions
  ansible.builtin.assert:
    that:
      - tungchiahui_production_env.stat.exists
      - tungchiahui_production_env.stat.isreg
      - tungchiahui_production_env.stat.uid == 0
      - tungchiahui_production_env.stat.mode == '0600'
    fail_msg: "Create {{ tungchiahui_production_env_file }} on the production host as root:root mode 0600 before provisioning."
  no_log: true

- name: Read production env file for fail-closed validation
  ansible.builtin.slurp:
    path: "{{ tungchiahui_production_env_file }}"
  register: tungchiahui_production_env_content
  no_log: true

- name: Decode production env file in memory
  ansible.builtin.set_fact:
    tungchiahui_production_env_text: "{{ tungchiahui_production_env_content.content | b64decode }}"
  no_log: true

- name: Validate required production env keys
  ansible.builtin.assert:
    that:
      - "'REPLACE_WITH_' not in tungchiahui_production_env_text"
      - "'BACKUP_R2_' not in tungchiahui_production_env_text"
      - "tungchiahui_production_env_text is search('(?m)^' ~ item ~ '=.+$')"
    fail_msg: "The host-local production env file is missing a required key or still contains a placeholder."
  loop:
    - ASSET_S3_ACCESS_KEY_ID
    - ASSET_S3_BUCKET
    - ASSET_S3_ENDPOINT
    - ASSET_S3_SECRET_ACCESS_KEY
    - BACKUP_AGE_IDENTITY_BASE64
    - BACKUP_AGE_RECIPIENT
    - BACKUP_OFFSITE_S3_ACCESS_KEY_ID
    - BACKUP_OFFSITE_S3_BUCKET
    - BACKUP_OFFSITE_S3_ENDPOINT
    - BACKUP_OFFSITE_S3_SECRET_ACCESS_KEY
    - BACKUP_S3_ACCESS_KEY_ID
    - BACKUP_S3_BUCKET
    - BACKUP_S3_ENDPOINT
    - BACKUP_S3_SECRET_ACCESS_KEY
    - CONTENT_WORKER_DATABASE_URL
    - CONTROL_API_DATABASE_URL
    - CONTROL_GITHUB_OIDC_POLICY_JSON
    - CONTROL_OPERATOR_KEYS_JSON
    - DATABASE_ADMIN_URL
    - DATABASE_MIGRATE_URL
    - DEPLOYMENT_REGISTRY_TOKEN
    - DEPLOYMENT_REGISTRY_USERNAME
    - GITHUB_CONTENT_REPOSITORY
    - PGBACKREST_REPO1_CIPHER_PASS
    - PGBOUNCER_USERLIST_BASE64
    - POSTGRES_DB
    - POSTGRES_PASSWORD
    - POSTGRES_USER
    - SITE_APP_LOGIN_NAME
    - SITE_APP_LOGIN_PASSWORD
    - SITE_BASE_URL
    - SITE_CONTENT_WORKER_LOGIN_NAME
    - SITE_CONTENT_WORKER_LOGIN_PASSWORD
    - SITE_CONTROL_API_LOGIN_NAME
    - SITE_CONTROL_API_LOGIN_PASSWORD
    - SITE_MIGRATOR_LOGIN_NAME
    - SITE_MIGRATOR_LOGIN_PASSWORD
    - SITE_REVALIDATION_SECRET
    - WEB_DATABASE_URL
  no_log: true

- name: Decode derived runtime secret files
  ansible.builtin.set_fact:
    tungchiahui_backup_age_identity: "{{ (tungchiahui_production_env_text | regex_search('(?m)^BACKUP_AGE_IDENTITY_BASE64=.+$') | regex_replace('^BACKUP_AGE_IDENTITY_BASE64=', '') | b64decode) }}"
    tungchiahui_pgbouncer_userlist: "{{ (tungchiahui_production_env_text | regex_search('(?m)^PGBOUNCER_USERLIST_BASE64=.+$') | regex_replace('^PGBOUNCER_USERLIST_BASE64=', '') | b64decode) }}"
  no_log: true

- name: Install derived runtime secret files without logging values
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ tungchiahui_secret_root }}/{{ item.destination }}"
    owner: root
    group: tungchiahui-runtime
    mode: "{{ item.mode }}"
  loop:
    - { content: "{{ tungchiahui_backup_age_identity }}", destination: backup-age-identity.txt, mode: "0640" }
    - { content: "{{ tungchiahui_pgbouncer_userlist }}", destination: pgbouncer-userlist.txt, mode: "0640" }
  no_log: true
  register: tungchiahui_runtime_secret_files

- name: Install version-controlled production topology
  ansible.builtin.copy:
    src: "{{ tungchiahui_repository_root }}/ops/production/{{ item.source }}"
    dest: "{{ tungchiahui_config_root }}/{{ item.destination }}"
    owner: root
    group: tungchiahui-runtime
    mode: "0640"
  loop:
    - { source: compose.yaml, destination: compose.yaml }
    - { source: openresty.conf, destination: openresty.conf }
    - { source: pgbouncer.ini, destination: pgbouncer.ini }
    - { source: pgbackrest.conf, destination: pgbackrest.conf }
  notify: Reconcile validated OpenResty configuration

- name: Inspect the installed OpenResty topology inputs
  ansible.builtin.stat:
    path: "{{ tungchiahui_config_root }}/{{ item }}"
    checksum_algorithm: sha256
  loop:
    - compose.yaml
    - openresty.conf
  register: tungchiahui_openresty_topology_inputs

- name: Define the expected OpenResty topology fingerprint
  ansible.builtin.set_fact:
    tungchiahui_openresty_topology_fingerprint: >-
      {{
        (
          tungchiahui_openresty_topology_inputs.results[0].stat.checksum
          ~ ':'
          ~ tungchiahui_openresty_topology_inputs.results[1].stat.checksum
        ) | hash('sha256')
      }}

- name: Inspect the applied OpenResty topology fingerprint
  ansible.builtin.stat:
    path: "{{ tungchiahui_config_root }}/openresty-topology.sha256"
  register: tungchiahui_openresty_topology_marker

- name: Read the applied OpenResty topology fingerprint
  ansible.builtin.slurp:
    path: "{{ tungchiahui_config_root }}/openresty-topology.sha256"
  register: tungchiahui_openresty_topology_marker_content
  when: tungchiahui_openresty_topology_marker.stat.exists

- name: Initialize the deployment-owned active slot only once
  ansible.builtin.copy:
    src: "{{ tungchiahui_repository_root }}/ops/production/active-slot.conf"
    dest: "{{ tungchiahui_config_root }}/deployment/active-slot.conf"
    owner: "70"
    group: tungchiahui-runtime
    mode: "0660"
    force: false

- name: Install implemented control-state backup hook
  ansible.builtin.copy:
    dest: "{{ tungchiahui_config_root }}/backup-hooks.d/control-state.yml"
    owner: root
    group: tungchiahui-runtime
    mode: "0640"
    content: |
      version: 2
      owner_phase: 13
      source: {{ tungchiahui_data_root }}/control-state/control.db
      consistency: sqlite-wal-checkpoint-vacuum-snapshot
      encryption: age
      replica: offsite-backup-s3
      restore_validation: schema-integrity-audit-continuity

- name: Read Docker socket ownership
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: tungchiahui_docker_socket

- name: Require a local Docker socket
  ansible.builtin.assert:
    that:
      - tungchiahui_docker_socket.stat.exists
      - tungchiahui_docker_socket.stat.issock
    fail_msg: A local Docker Engine socket is required; remote Docker contexts are not accepted.

- name: Define immutable Compose environment
  ansible.builtin.set_fact:
    tungchiahui_compose_environment:
      TUNGCHIAHUI_CONFIG_ROOT: "{{ tungchiahui_config_root }}"
      TUNGCHIAHUI_BACKUP_REPLICATION_CONCURRENCY: "{{ tungchiahui_backup_replication_concurrency }}"
      TUNGCHIAHUI_CONTENT_POLLING_ENABLED: "{{ tungchiahui_content_polling_enabled }}"
      TUNGCHIAHUI_CONTROL_RATE_LIMIT_PER_MINUTE: "{{ tungchiahui_control_rate_limit_per_minute }}"
      TUNGCHIAHUI_DATA_ROOT: "{{ tungchiahui_data_root }}"
      TUNGCHIAHUI_DEPLOYMENT_ARTICLE_PATH: "{{ tungchiahui_deployment_article_path }}"
      TUNGCHIAHUI_DEPLOYMENT_ASSET_PATH: "{{ tungchiahui_deployment_asset_path }}"
      TUNGCHIAHUI_BLUE_CONTAINER_NAME: "{{ tungchiahui_compose_project_name }}-web-blue-1"
      TUNGCHIAHUI_BLUE_DEPLOYMENT_SHA: "{{ tungchiahui_deployment_sha }}"
      TUNGCHIAHUI_DOCKER_SOCKET_GID: "{{ tungchiahui_docker_socket.stat.gid }}"
      TUNGCHIAHUI_DEPLOYMENT_BACKUP_MAX_AGE_SECONDS: "{{ tungchiahui_deployment_backup_max_age_seconds }}"
      TUNGCHIAHUI_DEPLOYMENT_IMAGE_REPOSITORY: "{{ tungchiahui_deployment_image_repository }}"
      TUNGCHIAHUI_DEPLOYMENT_SEARCH_QUERY: "{{ tungchiahui_deployment_search_query }}"
      TUNGCHIAHUI_GREEN_CONTAINER_NAME: "{{ tungchiahui_compose_project_name }}-web-green-1"
      TUNGCHIAHUI_GREEN_DEPLOYMENT_SHA: "{{ tungchiahui_deployment_sha }}"
      TUNGCHIAHUI_MIGRATION_CONTAINER_NAME: "{{ tungchiahui_compose_project_name }}-database-migrate-1"
      TUNGCHIAHUI_OPENRESTY_CONTAINER_NAME: "{{ tungchiahui_compose_project_name }}-openresty-1"
      TUNGCHIAHUI_ORIGIN_BIND_ADDRESS: "{{ tungchiahui_origin_bind_address }}"
      TUNGCHIAHUI_ORIGIN_PORT: "{{ tungchiahui_origin_port }}"
      TUNGCHIAHUI_OBSERVABILITY_BACKUP_MAX_AGE_SECONDS: "{{ tungchiahui_observability_backup_max_age_seconds }}"
      TUNGCHIAHUI_OBSERVABILITY_DISK_CRITICAL_PERCENT: "{{ tungchiahui_observability_disk_critical_percent }}"
      TUNGCHIAHUI_OBSERVABILITY_INTERVAL_SECONDS: "{{ tungchiahui_observability_interval_seconds }}"
      TUNGCHIAHUI_OBSERVABILITY_JOB_MAX_AGE_SECONDS: "{{ tungchiahui_observability_job_max_age_seconds }}"
      TUNGCHIAHUI_OBSERVABILITY_LATENCY_WARNING_MS: "{{ tungchiahui_observability_latency_warning_ms }}"
      TUNGCHIAHUI_OBSERVABILITY_ORIGIN_HOSTNAME: "{{ tungchiahui_observability_origin_hostname }}"
      TUNGCHIAHUI_OBSERVABILITY_ORIGIN_IPV6_REQUIRED: "{{ tungchiahui_observability_origin_ipv6_required }}"
      TUNGCHIAHUI_OBSERVABILITY_ORIGIN_SERVER_NAME: "{{ tungchiahui_observability_origin_server_name }}"
      TUNGCHIAHUI_OBSERVABILITY_ORIGIN_URL: "{{ tungchiahui_observability_origin_url }}"
      TUNGCHIAHUI_OBSERVABILITY_PUBLIC_ASSET_PATH: "{{ tungchiahui_observability_public_asset_path }}"
      TUNGCHIAHUI_OBSERVABILITY_PUBLIC_SERVER_NAME: "{{ tungchiahui_observability_public_server_name }}"
      TUNGCHIAHUI_OBSERVABILITY_PUBLIC_URL: "{{ tungchiahui_observability_public_url }}"
      TUNGCHIAHUI_OBSERVABILITY_RESTORE_DRILL_MAX_AGE_SECONDS: "{{ tungchiahui_observability_restore_drill_max_age_seconds }}"
      TUNGCHIAHUI_OBSERVABILITY_RESTORE_DRILL_TIMESTAMP: "{{ tungchiahui_observability_restore_drill_timestamp }}"
      TUNGCHIAHUI_POSTGRES_CONTAINER_NAME: "{{ tungchiahui_compose_project_name }}-postgres-1"
      TUNGCHIAHUI_POSTGRES_IMAGE: "{{ tungchiahui_postgres_image }}"
      TUNGCHIAHUI_PRODUCTION_ENV_FILE: "{{ tungchiahui_production_env_file }}"
      TUNGCHIAHUI_RECOVERY_IMAGE: "{{ tungchiahui_recovery_image }}"
      TUNGCHIAHUI_SECRET_DIRECTORY: "{{ tungchiahui_secret_root }}"
      TUNGCHIAHUI_SERVICE_IMAGE: "{{ tungchiahui_service_image }}"
      TUNGCHIAHUI_SEARCH_POLLING_ENABLED: "{{ tungchiahui_search_polling_enabled }}"
      TUNGCHIAHUI_WEB_BLUE_IMAGE: "{{ tungchiahui_web_image }}"
      TUNGCHIAHUI_WEB_GREEN_IMAGE: "{{ tungchiahui_web_image }}"

- name: Validate rendered Compose topology
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - config
      - --quiet
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false

- name: Schedule missing OpenResty convergence for scoped control-plane reconciliation
  ansible.builtin.debug:
    msg: Reconcile the validated on-disk OpenResty topology before scoped service changes.
  changed_when: true
  notify: Reconcile validated OpenResty configuration
  when:
    - not (tungchiahui_manage_stack | bool)
    - tungchiahui_reconcile_control_api | bool
    - >-
      not tungchiahui_openresty_topology_marker.stat.exists
      or
      (
        tungchiahui_openresty_topology_marker_content.content
        | default('')
        | b64decode
        | trim
      ) != tungchiahui_openresty_topology_fingerprint

- name: Apply pending OpenResty convergence before scoped service changes
  ansible.builtin.meta: flush_handlers
  when:
    - not (tungchiahui_manage_stack | bool)
    - tungchiahui_reconcile_control_api | bool

- name: Start and wait for the PostgreSQL foundation
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - up
      - --detach
      - --wait
      - postgres
  environment: "{{ tungchiahui_compose_environment }}"
  register: tungchiahui_postgres_up
  changed_when: >-
    'Created' in tungchiahui_postgres_up.stderr or
    'Started' in tungchiahui_postgres_up.stderr or
    'Recreated' in tungchiahui_postgres_up.stderr
  when: tungchiahui_manage_stack | bool

- name: Initialize the encrypted pgBackRest stanza
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - exec
      - --no-TTY
      - postgres
      - pgbackrest
      - --config=/etc/pgbackrest/pgbackrest.conf
      - --stanza=tungchiahui
      - stanza-create
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false
  when: tungchiahui_manage_stack | bool

- name: Verify PostgreSQL and WAL archive repository connectivity
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - exec
      - --no-TTY
      - postgres
      - pgbackrest
      - --config=/etc/pgbackrest/pgbackrest.conf
      - --stanza=tungchiahui
      - check
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false
  when: tungchiahui_manage_stack | bool

- name: Check database role bootstrap marker
  ansible.builtin.stat:
    path: "{{ tungchiahui_config_root }}/database-role-bootstrap.complete"
  register: tungchiahui_database_role_marker

- name: Read database role bootstrap marker
  ansible.builtin.slurp:
    path: "{{ tungchiahui_config_root }}/database-role-bootstrap.complete"
  register: tungchiahui_database_role_marker_content
  when: tungchiahui_database_role_marker.stat.exists

- name: Define expected database role bootstrap marker
  ansible.builtin.set_fact:
    tungchiahui_database_role_marker_expected: |-
      schema: 3
      production_env_sha256: {{ tungchiahui_production_env.stat.checksum }}

- name: Determine whether database roles require reconciliation
  ansible.builtin.set_fact:
    tungchiahui_database_role_bootstrap_required: >-
      {{
        tungchiahui_runtime_secret_files.changed
        or not tungchiahui_database_role_marker.stat.exists
        or ((tungchiahui_database_role_marker_content.content | default('') | b64decode | trim) != tungchiahui_database_role_marker_expected)
      }}

- name: Reconcile least-privilege database login identities
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - --profile
      - provision
      - run
      - --rm
      - database-role-bootstrap
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: true
  no_log: true
  when:
    - tungchiahui_manage_stack | bool
    - tungchiahui_database_role_bootstrap_required | bool

- name: Record successful database role bootstrap
  ansible.builtin.copy:
    dest: "{{ tungchiahui_config_root }}/database-role-bootstrap.complete"
    owner: root
    group: tungchiahui-runtime
    mode: "0640"
    content: |
      schema: 3
      production_env_sha256: {{ tungchiahui_production_env.stat.checksum }}
  when:
    - tungchiahui_manage_stack | bool
    - tungchiahui_database_role_bootstrap_required | bool

- name: Reconcile hardened production-like services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - up
      - --detach
      - --remove-orphans
  environment: "{{ tungchiahui_compose_environment }}"
  register: tungchiahui_compose_up
  changed_when: >-
    'Created' in tungchiahui_compose_up.stderr or
    'Started' in tungchiahui_compose_up.stderr or
    'Recreated' in tungchiahui_compose_up.stderr
  when: tungchiahui_manage_stack | bool

- name: Prepare the scoped migration runner for the control API release
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - --profile
      - deployment
      - create
      - --force-recreate
      - database-migrate
  environment: "{{ tungchiahui_compose_environment }}"
  register: tungchiahui_scoped_migration_runner_prepare
  until: tungchiahui_scoped_migration_runner_prepare.rc == 0
  retries: 5
  delay: 3
  changed_when: false
  no_log: true
  when:
    - not (tungchiahui_manage_stack | bool)
    - tungchiahui_reconcile_control_api | bool

- name: Apply reviewed database migrations for the scoped control API release
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - --profile
      - deployment
      - run
      - --rm
      - --no-deps
      - database-migrate
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false
  no_log: true
  when:
    - not (tungchiahui_manage_stack | bool)
    - tungchiahui_reconcile_control_api | bool

- name: Reconcile the independent service release as one reviewed unit
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - up
      - --detach
      - --no-deps
      - --wait
      - control-api
      - content-worker
      - observability-agent
      - deploy-agent
  environment: "{{ tungchiahui_compose_environment }}"
  register: tungchiahui_control_api_up
  until: tungchiahui_control_api_up.rc == 0
  retries: 5
  delay: 3
  changed_when: >-
    'Created' in tungchiahui_control_api_up.stderr or
    'Started' in tungchiahui_control_api_up.stderr or
    'Recreated' in tungchiahui_control_api_up.stderr
  when:
    - not (tungchiahui_manage_stack | bool)
    - tungchiahui_reconcile_control_api | bool

- name: Install the audited daily backup scheduler service
  ansible.builtin.copy:
    dest: /etc/systemd/system/tungchiahui-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Enqueue the audited Tungchiahui production backup
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker exec {{ tungchiahui_compose_project_name }}-deploy-agent-1 node dist/recovery-scheduler.cjs
      TimeoutStartSec=60
  when: tungchiahui_manage_backup_schedule | bool

- name: Install the 03:05 Asia Hong Kong daily backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/tungchiahui-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run the Tungchiahui production backup near 03:00 daily

      [Timer]
      OnCalendar=*-*-* 03:05:00 Asia/Hong_Kong
      Persistent=true
      AccuracySec=1min
      RandomizedDelaySec=0

      [Install]
      WantedBy=timers.target
  when: tungchiahui_manage_backup_schedule | bool

- name: Apply the explicitly selected daily backup schedule state
  ansible.builtin.systemd_service:
    name: tungchiahui-backup.timer
    daemon_reload: true
    enabled: "{{ tungchiahui_backup_schedule_enabled | bool }}"
    state: "{{ 'started' if tungchiahui_backup_schedule_enabled | bool else 'stopped' }}"
  when: tungchiahui_manage_backup_schedule | bool

- name: Prepare the stopped least-privilege migration runner for deploy-agent
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - --profile
      - deployment
      - create
      - --force-recreate
      - database-migrate
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false
  no_log: true
  when: tungchiahui_manage_stack | bool

- name: Validate OpenResty configuration in the running topology
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - exec
      - --no-TTY
      - openresty
      - openresty
      - -t
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false
  when: tungchiahui_manage_stack | bool
