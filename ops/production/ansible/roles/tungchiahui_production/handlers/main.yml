---
- name: Validate OpenResty before recreation
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - run
      - --rm
      - --no-deps
      - --entrypoint
      - openresty
      - openresty
      - -t
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: false
  listen: Reconcile validated OpenResty configuration
  when: >-
    (tungchiahui_manage_stack | bool) or
    (tungchiahui_reconcile_control_api | bool)

- name: Recreate OpenResty after successful validation
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ tungchiahui_production_env_file }}"
      - --project-name
      - "{{ tungchiahui_compose_project_name }}"
      - --file
      - "{{ tungchiahui_config_root }}/compose.yaml"
      - up
      - --detach
      - --no-deps
      - --force-recreate
      - --wait
      - openresty
  environment: "{{ tungchiahui_compose_environment }}"
  changed_when: true
  listen: Reconcile validated OpenResty configuration
  when: >-
    (tungchiahui_manage_stack | bool) or
    (tungchiahui_reconcile_control_api | bool)
